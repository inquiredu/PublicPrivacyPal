name: Local foundation CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  installer-entrypoints:
    name: Fresh-copy installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Copy installer without dependencies into a path with spaces
        shell: node {0}
        run: |
          const fs = require('node:fs');
          const path = require('node:path');
          const target = path.join(process.env.RUNNER_TEMP, 'PrivacyPal copied repository');
          fs.mkdirSync(path.join(target, 'scripts'), { recursive: true });
          for (const file of ['package.json', 'install.sh', 'install.ps1', 'Install PrivacyPal.command', 'scripts/setup.mjs']) {
            fs.copyFileSync(file, path.join(target, file));
          }
      - name: Run copied Unix launcher from another directory
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          sh "$RUNNER_TEMP/PrivacyPal copied repository/install.sh" --check
      - name: Run copied macOS launcher
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          sh "$RUNNER_TEMP/PrivacyPal copied repository/Install PrivacyPal.command" --check
      - name: Run copied PowerShell launcher from another directory
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Set-Location -LiteralPath $env:RUNNER_TEMP
          & (Join-Path $env:RUNNER_TEMP 'PrivacyPal copied repository/install.ps1') --check
          exit $LASTEXITCODE
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run ci
      - name: Authorization tests with Auth and Firestore emulators
        run: npm run test:integration
      - name: Full local backup and recovery rehearsal
        run: npm run test:recovery
